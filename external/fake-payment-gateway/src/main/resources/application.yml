server:
  port: 8090

spring:
  application:
    name: fake-payment-gateway

gateway:
  limit: 1000

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_BASE_URL:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_BASE_URL:http://localhost:4318}/v1/metrics
        step: 10s
