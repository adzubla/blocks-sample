# Defaults point at localhost so the service also runs from an IDE against `docker compose up`
# infrastructure. docker-compose.yml overrides them with environment variables.
server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/payments
    username: payment_svc
    password: payment_svc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    # Propagates the trace across Kafka.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  mvc:
    # TODO(error-handler): Spring's default RFC 9457 bodies for now, with no stable error codes.
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_BASE_URL:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_BASE_URL:http://localhost:4318}/v1/metrics
        step: 10s

app:
  payment-gateway:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8090}
