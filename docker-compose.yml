# Whole system: infrastructure + services.
#   docker compose up --build
# Infrastructure only, to run the services from an IDE:
#   docker compose up postgres kafka rabbitmq mailpit lgtm kafka-ui

x-app: &app
  build: &app-build
    context: .
    dockerfile: docker/Dockerfile
  restart: on-failure
  environment: &app-env
    DB_HOST: postgres
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    RABBITMQ_HOST: rabbitmq
    OTLP_BASE_URL: http://lgtm:4318
    SMTP_HOST: mailpit
    INVENTORY_BASE_URL: http://inventory-service:8082
    PAYMENT_GATEWAY_BASE_URL: http://fake-payment-gateway:8090
  depends_on: &app-deps
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    lgtm: { condition: service_started }

services:

  # ---------------------------------------------------------------- services
  order-service:
    <<: *app
    build: { <<: *app-build, args: { MODULE: services/order-service } }
    ports: ["8081:8081"]

  inventory-service:
    <<: *app
    build: { <<: *app-build, args: { MODULE: services/inventory-service } }
    ports: ["8082:8082"]

  payment-service:
    <<: *app
    build: { <<: *app-build, args: { MODULE: services/payment-service } }
    ports: ["8083:8083"]

  notification-service:
    <<: *app
    build: { <<: *app-build, args: { MODULE: services/notification-service } }
    ports: ["8084:8084"]
    depends_on:
      <<: *app-deps
      mailpit: { condition: service_started }

  # Dummy external system.
  fake-payment-gateway:
    <<: *app
    build: { <<: *app-build, args: { MODULE: external/fake-payment-gateway } }
    ports: ["8090:8090"]
    depends_on:
      lgtm: { condition: service_started }

  # ---------------------------------------------------------- infrastructure
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Containers use kafka:9092, the host uses localhost:9094.
  kafka:
    image: apache/kafka:4.1.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Only the owning service creates its topic (NewTopic bean, 3 partitions). If a consumer
      # that starts first could auto-create it, the topic would get the wrong partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: blocks-sample
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # Dummy email provider: catches every email sent over SMTP and shows it in a web UI.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  # Grafana + Prometheus + Tempo + Loki + OpenTelemetry collector, in one container.
  lgtm:
    image: grafana/otel-lgtm:0.13.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
