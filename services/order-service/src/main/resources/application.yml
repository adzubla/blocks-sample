# Defaults point at localhost so the service also runs from an IDE against `docker compose up`
# infrastructure. docker-compose.yml overrides them with environment variables.
server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/orders
    username: order_svc
    password: order_svc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    # Propagates the trace across Kafka.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: app
    password: app
    template:
      observation-enabled: true
  mvc:
    # TODO(error-handler): Spring's default RFC 9457 bodies for now, with no stable error codes.
    problemdetails:
      enabled: true

app:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_BASE_URL:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_BASE_URL:http://localhost:4318}/v1/metrics
        step: 10s
